# On every push: build the site, run the tests, check dependencies, and scan the code.
name: Checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, so new advisories are caught even without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high --omit=dev

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
